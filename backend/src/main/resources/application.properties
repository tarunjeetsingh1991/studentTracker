
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=student-tracker-backend
server.port=${PORT:8080}


# ==========================================
# DATABASE - MYSQL (LOCAL / AIVEN)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_tracker?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==========================================
# CORS - REACT FRONTEND
# ==========================================
app.cors.origin=${CORS_ORIGIN:https://student-tracker-frontend.pages.dev}


# ==========================================
# SESSION COOKIE CONFIGURATION
# ==========================================
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true


# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
